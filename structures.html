<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Church Structures - KIC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-shell">
  <header class="page-header">
    <a href="Home.html" style="color:var(--yellow);font-weight:800;">← Home</a>
    <h1>Church Structures</h1>
  </header>
  <main class="page-main">
    <div class="page-card">
      <div id="structuresContainer"></div>
    </div>
  </main>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const data = await window.KIC.getSiteData();
      const container = document.getElementById('structuresContainer');
      const structures = data.structures || [];
      if (!structures.length) {
        container.innerHTML = '<p>No structures saved yet.</p>';
        return;
      }
      container.innerHTML = structures.map(s => `
        <section class="structure-block">
          <h2>${s.name}</h2>
          <div class="structure-body">
            <div class="structure-img-wrap">
              ${s.image ? `<img src="${s.image}" alt="${s.name}" />` : ''}
            </div>
            <div class="structure-members">
              ${(s.members||[]).map(m => `<div class="structure-member-row"><strong>${m.name}</strong><span>${m.role||'Member'}</span></div>`).join('')}
            </div>
          </div>
        </section>
      `).join('');
    });
  </script>
</body>
</html>
